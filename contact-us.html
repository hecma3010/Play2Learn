<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us | Play2Learn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <nav aria-label="Main" class="navbar navbar-expand-lg border-bottom">
            <div class="container-fluid">
                <a href="index.html" class="navbar-brand">Play2Learn</a>
                <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#main-menu"
                    aria-controls="main-menu" aria-expanded="false" aria-label="Toggle Navigation"><span
                        class="navbar-toggler-icon"></span></button>
                <div id="main-menu" class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a href="index.html" class="nav-link">Home</a>
                        </li>
                        <li class="nav-item dropdown">
                            <button type="button" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"
                                aria-expanded="false">Games</button>
                            <ul class="dropdown-menu">
                                <li>
                                    <a href="games/anagram-hunt.html" class="dropdown-item">Anagram Hunt</a>
                                </li>
                                <li>
                                    <a href="games/math-facts.html" class="dropdown-item">Math Facts
                                        Practice</a>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a href="about.html" class="nav-link">About</a>
                        </li>
                        <li class="nav-item">
                            <a href="login.html" class="nav-link">Login</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container my-4">
        <div class="col-lg-8 mx-auto">
            <h1>Contact Us</h1>
            <form action="javascript:alert('Form Submitted')">
                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label" for="contact-email">Your email:</label>
                    <div class="col-sm-9">
                        <input class="form-control" type="email" id="contact-email" name="email" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label" for="contact-subject">Subject:</label>
                    <div class="col-sm-9">
                        <input class="form-control" type="text" id="contact-subject" name="subject" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label" for="contact-message">Message:</label>
                    <div class="col-sm-9">
                        <textarea class="form-control" id="contact-message" name="message" rows="5" required></textarea>
                    </div>
                </div>
                <div class="text-end">
                    <button class="btn btn-success" type="submit">Send</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="container d-flex justify-content-between align-items-center border-top mt-5 py-3">
        <p class="mb-0 small">&copy; 2026 Play2Learn</p>
        <nav aria-label="Social">
            <ul class="list-unstyled d-flex gap-3 mb-0">
                <li>
                    <a href="contact-us.html" aria-current="page" aria-label="Contact Us"><i class="bi-envelope fs-4"
                            aria-hidden="true"></i></a>
                </li>
                <li>
                    <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram"><i
                            class="bi-instagram fs-4" aria-hidden="true"></i></a>
                </li>
                <li>
                    <a href="https://twitter.com" target="_blank" rel="noopener" aria-label="Twitter"><i
                            class="bi-twitter fs-4" aria-hidden="true"></i></a>
                </li>
                <li>
                    <a href="https://facebook.com" target="_blank" rel="noopener" aria-label="Facebook"><i
                            class="bi-facebook fs-4" aria-hidden="true"></i></a>
                </li>
            </ul>
        </nav>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
