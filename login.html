<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Play2Learn</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <a href="index.html">Play2Learn</a>
        <nav aria-label="Main">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <button type="button">Games</button>
                    <ul>
                        <li>
                            <a href="games/anagram-hunt.html">Anagram Hunt</a>
                        </li>
                        <li>
                            <a href="games/math-facts.html">Math Facts Practice</a>
                        </li>
                    </ul>
                </li>
                <li>
                    <a href="about.html">About</a>
                </li>
                <li>
                    <a href="login.html" aria-current="page">Login</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="login-section">
            <h1>Log in</h1>
            <form action="javascript:alert('Form Submitted')">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" name="email" autocomplete="email" required>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                <button type="submit">Login</button>
            </form>
            <button type="button" id="show-register">Need an account? Register.</button>
        </section>
        <section id="register-section" hidden>
            <h1>Register</h1>
            <form action="javascript:alert('Form Submitted')">
                <label for="register-email">Email:</label>
                <input type="email" id="register-email" name="email" autocomplete="email" required>
                <label for="register-password">Password:</label>
                <input type="password" id="register-password" name="password" autocomplete="new-password" required>
                <label for="register-password-repeat">Repeat Password:</label>
                <input type="password" id="register-password-repeat" name="password-repeat" autocomplete="new-password"
                    required>
                <input type="checkbox" id="register-age" name="age-confirmation" required>
                <label for="register-age">I am over 13 and like playing games.</label>
                <button type="submit">Register</button>
            </form>
            <button type="button" id="show-login">Have an account? Log in.</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Play2Learn</p>
        <nav aria-label="Social">
            <ul>
                <li>
                    <a href="contact-us.html">Email</a>
                </li>
                <li>
                    <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
                </li>
                <li>
                    <a href="https://twitter.com" target="_blank" rel="noopener">Twitter</a>
                </li>
                <li>
                    <a href="https://facebook.com" target="_blank" rel="noopener">Facebook</a>
                </li>
            </ul>
        </nav>
    </footer>
    <script src="js/login.js"></script>
</body>

</html>
