<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Play2Learn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <nav aria-label="Main" class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a href="index.html" class="navbar-brand">Play2Learn</a>
                <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#main-menu"
                    aria-controls="main-menu" aria-expanded="false" aria-label="Toggle Navigation"><span
                        class="navbar-toggler-icon"></span></button>
                <div id="main-menu" class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a href="index.html" class="nav-link">Home</a>
                        </li>
                        <li class="nav-item dropdown">
                            <button type="button" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"
                                aria-expanded="false">Games</button>
                            <ul class="dropdown-menu">
                                <li>
                                    <a href="games/anagram-hunt.html" class="dropdown-item">Anagram Hunt</a>
                                </li>
                                <li>
                                    <a href="games/math-facts.html" class="dropdown-item">Math Facts
                                        Practice</a>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a href="about.html" class="nav-link">About</a>
                        </li>
                        <li class="nav-item">
                            <a href="login.html" aria-current="page" class="nav-link active">Login</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section id="login-section">
            <h1>Log in</h1>
            <form action="javascript:alert('Form Submitted')">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" name="email" autocomplete="email" required>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                <button type="submit">Login</button>
            </form>
            <button type="button" id="show-register">Need an account? Register.</button>
        </section>
        <section id="register-section" hidden>
            <h1>Register</h1>
            <form action="javascript:alert('Form Submitted')">
                <label for="register-email">Email:</label>
                <input type="email" id="register-email" name="email" autocomplete="email" required>
                <label for="register-password">Password:</label>
                <input type="password" id="register-password" name="password" autocomplete="new-password" required>
                <label for="register-password-repeat">Repeat Password:</label>
                <input type="password" id="register-password-repeat" name="password-repeat" autocomplete="new-password"
                    required>
                <input type="checkbox" id="register-age" name="age-confirmation" required>
                <label for="register-age">I am over 13 and like playing games.</label>
                <button type="submit">Register</button>
            </form>
            <button type="button" id="show-login">Have an account? Log in.</button>
        </section>
    </main>
    <footer class="d-flex justify-content-between align-items-center">
        <p>&copy; 2026 Play2Learn</p>
        <nav aria-label="Social">
            <ul class="list-unstyled d-flex gap-3">
                <li>
                    <a href="contact-us.html" aria-label="Contact Us"><i class="bi-envelope" aria-hidden="true"></i></a>
                </li>
                <li>
                    <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram"><i
                            class="bi-instagram" aria-hidden="true"></i></a>
                </li>
                <li>
                    <a href="https://twitter.com" target="_blank" rel="noopener" aria-label="Twitter"><i
                            class="bi-twitter" aria-hidden="true"></i></a>
                </li>
                <li>
                    <a href="https://facebook.com" target="_blank" rel="noopener" aria-label="Facebook"><i
                            class="bi-facebook" aria-hidden="true"></i></a>
                </li>
            </ul>
        </nav>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
